[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.ruff.lint.per-file-ignores]
"*/migrations/*.py" = ["E501"]
